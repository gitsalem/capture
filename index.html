<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capture">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Capture Tweet</title>
<style>
/* Un seul écran, sans défilement : l'aperçu prend toute la place libre,
   les réglages tiennent dans un bandeau compact en bas, sous le pouce. */
:root{
  --bg:#0E0F11; --panel:#16181B; --line:#26292E; --fg:#F2F3F5; --muted:#8A9099; --track:#2C3036;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Ouverte depuis l'écran d'accueil, plus de barre Safari : le titre a besoin de plus d'air sous l'heure. */
@media (display-mode:standalone){html{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;display:flex;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
main{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;font-weight:650;margin:0;letter-spacing:-.01em}
.count{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pick{position:relative;display:inline-flex;align-items:center;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
/* Invisible mais toujours dans l'ordre de tabulation (hidden le retirerait du clavier). */
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.stage{flex:1;min-height:160px;position:relative;border-radius:14px;border:1px solid var(--line);
  background:repeating-conic-gradient(#15171A 0 25%, #1A1C20 0 50%) 0 0/18px 18px}
.stage img,.stage canvas{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;-webkit-touch-callout:default}
.tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:6px}

.controls{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--fg);margin-top:-9px;border:none}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--fg);border:none}

.bglabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:2px 0 -2px}
.bglabel span:last-child{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-left:12px}
.swatches{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:3px 2px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none;width:48px;height:48px;padding:0;border:2px solid transparent;border-radius:12px;background:none;cursor:pointer;scroll-snap-align:start}
.sw canvas{display:block;width:100%;height:100%;border-radius:9px}
.sw[aria-pressed="true"]{border-color:var(--fg)}

.export{background:var(--fg);color:var(--bg);border:none;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:16px;width:100%;cursor:pointer}
#status{margin:-4px 0 0;font-size:12px;color:var(--muted);text-align:center;min-height:1.2em}
.pick:focus-within,button:focus-visible,input:focus-visible{outline:2px solid #6FA8FF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main>
  <div class="head">
    <div>
      <h1>Capture Tweet</h1>
      <span class="count" id="count"></span>
    </div>
    <label class="pick">Choisir une capture<input id="file" type="file" accept="image/*"></label>
  </div>

  <div class="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <img id="out" alt="Aperçu de l'image finale">
    <span class="tag" id="tag">Exemple</span>
  </div>

  <div class="controls">
    <label class="row" for="top">Haut <input id="top" type="range" min="0" max="60" step="0.5" value="0"><output id="topV">0 %</output></label>
    <label class="row" for="bot">Bas <input id="bot" type="range" min="0" max="60" step="0.5" value="0"><output id="botV">0 %</output></label>

    <p class="bglabel"><span>Fond</span><span id="bgName"></span></p>
    <div class="swatches" id="swatches" role="group" aria-label="Fonds"></div>

    <button class="export" id="export" type="button">Enregistrer ou partager</button>
    <p id="status" role="status">Appui long sur l'image : l'enregistrer dans Photos.</p>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), out = $('out');

  // Un fond par couleur de la gamme Apple actuelle (teintes approchées, pas les codes officiels).
  // Chaque fond : dégradé de la teinte, un halo clair en haut, un halo voisin en bas.
  const BGS = [
    // iPhone 17 Pro
    {name:'Argent · iPhone 17 Pro',            base:['#C9CCD1', '#EEF0F2'], glow:[['#FFFFFF', .2, .1], ['#B8C2CF', .85, .95]]},
    {name:'Orange cosmique · iPhone 17 Pro',   base:['#C9440E', '#F57A2A'], glow:[['#FFC08A', .8, .1], ['#E0313B', .15, .95]]},
    {name:'Bleu intense · iPhone 17 Pro',      base:['#0F1E36', '#2A4470'], glow:[['#4F6E9E', .2, .1], ['#1B2A4D', .85, .95]]},
    // iPhone Air
    {name:'Noir sidéral · iPhone Air',         base:['#0B0B0D', '#232327'], glow:[['#3A3A40', .8, .1], ['#15151A', .15, .95]]},
    {name:'Blanc nuage · iPhone Air',          base:['#ECEDEF', '#FBFBFC'], glow:[['#FFFFFF', .2, .1], ['#DDE3EC', .85, .95]]},
    {name:'Or clair · iPhone Air',             base:['#D8C29A', '#F2E6CC'], glow:[['#FFF4DC', .8, .1], ['#D9B98C', .15, .95]]},
    {name:'Bleu ciel · iPhone Air',            base:['#8FB6DA', '#CFE3F3'], glow:[['#EAF5FF', .2, .1], ['#9AA9E0', .85, .95]]},
    // iPhone 17
    {name:'Lavande · iPhone 17',               base:['#A894D6', '#DCD0F2'], glow:[['#F3EDFF', .8, .1], ['#C79BD9', .15, .95]]},
    {name:'Bleu brume · iPhone 17',            base:['#7F9FC2', '#C6D6E8'], glow:[['#E8F1FA', .2, .1], ['#8F9CC9', .85, .95]]},
    {name:'Sauge · iPhone 17',                 base:['#7F9473', '#C3CFB4'], glow:[['#E6EEDC', .8, .1], ['#93A88C', .15, .95]]},
    // iMac
    {name:'Bleu · iMac',                       base:['#1F5FA8', '#4A93DA'], glow:[['#9CD0FF', .2, .1], ['#3E58C9', .85, .95]]},
    {name:'Vert · iMac',                       base:['#2F7F4F', '#5DBB7D'], glow:[['#B5EBC4', .8, .1], ['#2F8F86', .15, .95]]},
    {name:'Rose · iMac',                       base:['#C9435A', '#F07F8E'], glow:[['#FFC7CE', .2, .1], ['#E35E9C', .85, .95]]},
    {name:'Jaune · iMac',                      base:['#E0A51A', '#F7CF4A'], glow:[['#FFF0A8', .8, .1], ['#F08F2E', .15, .95]]},
    {name:'Orange · iMac',                     base:['#D9571E', '#F48B47'], glow:[['#FFC79C', .2, .1], ['#E8455A', .85, .95]]},
    {name:'Violet · iMac',                     base:['#6A4AAE', '#9E7FDC'], glow:[['#D9C8FF', .8, .1], ['#4E5DC9', .15, .95]]},
    // MacBook Air et iPad Air
    {name:'Minuit · MacBook Air',              base:['#141B26', '#2C3646'], glow:[['#45536B', .8, .1], ['#1A2233', .15, .95]]},
    {name:'Lumière stellaire · MacBook Air',   base:['#E3D9C8', '#F6F1E8'], glow:[['#FFFBF3', .2, .1], ['#E6D3BE', .85, .95]]},
    {name:'Gris sidéral · iPad Air',          base:['#3B3D42', '#6A6D73'], glow:[['#8C9097', .2, .1], ['#2E3035', .85, .95]]},
    {name:'Violet · iPad Air',                 base:['#8A78B8', '#C2B6DF'], glow:[['#EAE3FA', .8, .1], ['#9B86C9', .15, .95]]},
  ];
  const mem = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let bg = Math.min(BGS.length - 1, Math.max(0, mem.get('bg6', 0)));
  let src = null, isExample = true, fileName = 'capture', lastBlob = null;

  // Compteur des captures traitées, gardé d'une visite à l'autre.
  let count = mem.get('count', 0);
  function showCount(){ $('count').textContent = count + (count > 1 ? ' images traitées' : ' image traitée'); }
  showCount();

  $('top').value = mem.get('top', 0);
  $('bot').value = mem.get('bot', 0);

  function paintBg(c, W, H, p){
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, p.base[0]); g.addColorStop(1, p.base[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const R = Math.hypot(W, H) * .6;
    p.glow.forEach(([col, fx, fy]) => {
      const r = c.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, R);
      r.addColorStop(0, col + 'CC'); r.addColorStop(.55, col + '33'); r.addColorStop(1, col + '00');
      c.fillStyle = r; c.fillRect(0, 0, W, H);
    });
  }

  // ---- vignettes de fonds, dessinées avec le même code que l'export ----
  const sw = $('swatches');
  BGS.forEach((b, i) => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'sw'; el.setAttribute('aria-label', b.name);
    const c = document.createElement('canvas'); c.width = c.height = 120;
    paintBg(c.getContext('2d'), 120, 120, b);
    el.appendChild(c);
    el.onclick = () => { bg = i; mem.set('bg6', i); syncBg(); render(); };
    sw.appendChild(el);
  });
  function syncBg(){
    [...sw.children].forEach((c, j) => c.setAttribute('aria-pressed', j === bg));
    $('bgName').textContent = BGS[bg].name;
    const cur = sw.children[bg]; if(cur) cur.scrollIntoView({block:'nearest', inline:'nearest'});
  }

  // ---- exemple au chargement ----
  function makeExample(){
    const c = document.createElement('canvas'); c.width = 1170; c.height = 1100;
    const x = c.getContext('2d'), F = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
    x.fillStyle = '#fff'; x.fillRect(0, 0, 1170, 1100);
    x.fillStyle = '#C9D3DC'; x.beginPath(); x.arc(110, 130, 62, 0, Math.PI*2); x.fill();
    x.fillStyle = '#0F1419'; x.font = `700 46px ${F}`; x.fillText('Ton compte', 200, 120);
    x.fillStyle = '#536471'; x.font = `400 40px ${F}`; x.fillText('@toncompte', 200, 175);
    x.fillStyle = '#0F1419'; x.font = `400 52px ${F}`;
    ['Choisis une capture d’écran de ton', 'post : elle apparaîtra ici, sur un', 'fond propre, prête à partager.']
      .forEach((l, i) => x.fillText(l, 50, 320 + i*72));
    x.fillStyle = '#536471'; x.font = `400 38px ${F}`; x.fillText('18:28 · 24 oct. 2026', 50, 580);
    x.fillStyle = '#EFF3F4'; x.fillRect(0, 640, 1170, 2);
    x.fillStyle = '#536471';
    ['12 Reposts', '48 J’aime', '3 Signets'].forEach((l, i) => x.fillText(l, 50 + i*300, 720));
    x.fillStyle = '#EFF3F4'; x.fillRect(0, 780, 1170, 2);
    return c;
  }

  // ---- import ----
  $('file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const im = new Image(), u = URL.createObjectURL(f);
    im.onload = () => {
      URL.revokeObjectURL(u);
      src = im; isExample = false; $('tag').hidden = true;
      fileName = (f.name || 'capture').replace(/\.[^.]+$/, '');
      count++; mem.set('count', count); showCount();
      $('status').textContent = "Appui long sur l'image : l'enregistrer dans Photos.";
      render();
    };
    im.onerror = () => {
      URL.revokeObjectURL(u);
      $('status').textContent = "Cette image n'a pas pu être ouverte. Essaie une capture en PNG ou JPEG.";
    };
    im.src = u; e.target.value = '';
  });

  // Le rendu suit le doigt ; l'écriture localStorage (synchrone) attend la fin du geste.
  ['top', 'bot'].forEach(k => {
    $(k).addEventListener('input', render);
    $(k).addEventListener('change', () => mem.set(k, +$(k).value));
  });

  // ---- dessin ----
  function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }

  let raf = 0, gen = 0, blobTimer = 0;
  function render(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }

  function draw(){
    const img = src, iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    let t = +$('top').value, b = +$('bot').value;
    if(t + b > 90){ b = 90 - t; $('bot').value = b; }
    $('topV').textContent = String(t).replace('.', ',') + ' %';
    $('botV').textContent = String(b).replace('.', ',') + ' %';

    const sy = Math.round(ih * t / 100), sh = Math.max(1, Math.round(ih * (100 - t - b) / 100));
    // Règles de Marc Lou : marge courte pour que la capture reste grande dans le fil,
    // contenu centré, jamais de format paysage (au minimum carré)
    // Grille de 4 (Marc Lou), en points iPhone : marge 24, arrondi 16, ombre 16/4.
    // Une capture iPhone est en @3x (1170-1320 px de large), un petit écran en @2x.
    const pt = iw >= 1000 ? 3 : iw >= 600 ? 2 : 1;
    const pad = 24 * pt, radius = 16 * pt;
    const W = iw + pad * 2, H = Math.max(sh + pad * 2, W);
    cv.width = W; cv.height = H;
    const x = pad, y = Math.round((H - sh) / 2);

    paintBg(ctx, W, H, BGS[bg]);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 16 * pt; ctx.shadowOffsetY = 4 * pt;
    rr(x, y, iw, sh, radius); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();

    ctx.save(); rr(x, y, iw, sh, radius); ctx.clip();
    ctx.drawImage(img, 0, sy, iw, sh, x, y, iw, sh);
    ctx.restore();

    // Pendant les réglages on montre le canvas tel quel. Le PNG, nécessaire à l'appui
    // long et à l'export, n'est encodé qu'une fois le geste terminé : un seul encodage
    // au lieu d'un par image. Le jeton `gen` jette les encodages arrivés dans le désordre.
    out.hidden = true;
    lastBlob = null;
    const my = ++gen;
    clearTimeout(blobTimer);
    blobTimer = setTimeout(() => {
      cv.toBlob(bl => {
        if(my !== gen || !bl) return;
        if(out.dataset.u) URL.revokeObjectURL(out.dataset.u);
        out.dataset.u = URL.createObjectURL(bl); out.src = out.dataset.u;
        out.hidden = false;
        lastBlob = bl;
      }, 'image/png');
    }, 150);
  }

  // ---- export : feuille de partage iOS (doit partir directement du toucher) ----
  $('export').addEventListener('click', async () => {
    const st = $('status');
    if(isExample){ st.textContent = "Choisis d'abord une capture."; return; }
    if(!lastBlob){ st.textContent = 'Image en préparation, réessaie dans une seconde.'; return; }
    const file = new File([lastBlob], fileName + '-propre.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file]}); st.textContent = ''; }
      catch(e) { if(e && e.name !== 'AbortError') st.textContent = "Fais un appui long sur l'image pour l'enregistrer."; }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    st.textContent = 'Image téléchargée.';
  });

  src = makeExample();
  syncBg();
  draw();
})();

if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
